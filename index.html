<!DOCTYPE html>
<html>
<head>
    <title>PupBox.no</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #fff8f0;
            text-align: center;
            padding: 40px;
        }

        h1 {
            color: #ff8fab;
            font-size: 3em;
        }

        .pup-card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin: 20px auto;
            width: 300px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        button {
            background: #a0e7e5;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1em;
        }

        button:hover {
            background: #b4f8c8;
        }
    </style>
</head>
<body>

    <h1>🐶 PupBox.no 🐶</h1>
    <p><b>Find your perfect Pup :3</b></p>
    <p>Tiny. Sleepy. Slightly dramatic. Ready for adoption.</p>

    <div class="pup-card">
        <h2>Sleepy Pup</h2>
        <p>Falls asleep anywhere. Needs blankets.</p>
        <button>Adopt me</button>
    </div>

    <div class="pup-card">
        <h2>Chaos Pup</h2>
        <p>Stole 4 socks. No regrets.</p>
        <button>Adopt me</button>
    </div>

    <div class="pup-card">
        <h2>Crybaby Pup</h2>
        <p>Cried because toast looked weird.</p>
        <button>Adopt me</button>
    </div>

    <p>⚠ Pups may maow loudly. Some bite (lovingly).</p>

</body>
</html>
